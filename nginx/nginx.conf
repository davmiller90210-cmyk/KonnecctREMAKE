events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    server {
        listen 80;
        server_name app.konnecct.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name app.konnecct.com;

        ssl_certificate /etc/letsencrypt/live/app.konnecct.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.konnecct.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;

        location = /projects {
            return 301 https://$host/projects/;
        }

        location /projects/ {
            proxy_pass http://crm-server:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        # Do not 301 here: Mattermost may 302 to the no-trailing-slash URL → endless 301↔302 with /.../ .
        location = /_konnecct/mattermost {
            client_max_body_size 250M;
            if ($request_method = HEAD) {
                return 200;
            }
            proxy_pass http://mattermost:8065/;
            include /etc/nginx/mattermost-upstream-common.conf;
        }

        # Subpath + HEAD can 302 forever (Mattermost bug); official nginx workaround.
        # https://docs.mattermost.com/deployment-guide/server/setup-nginx-proxy.html
        location /_konnecct/mattermost/ {
            client_max_body_size 250M;
            if ($request_method = HEAD) {
                return 200;
            }
            proxy_pass http://mattermost:8065/;
            include /etc/nginx/mattermost-upstream-common.conf;
        }

        # Mattermost client calls /api/v4/* at the site root.
        location ^~ /api/v4/ {
            proxy_pass http://mattermost:8065;
            include /etc/nginx/mattermost-upstream-common.conf;
        }

        # MM auth flows use root paths; CRM sign-in is /welcome (Clerk), not /login.
        location ^~ /login {
            proxy_pass http://mattermost:8065;
            include /etc/nginx/mattermost-upstream-common.conf;
        }

        location ^~ /signup {
            proxy_pass http://mattermost:8065;
            include /etc/nginx/mattermost-upstream-common.conf;
        }

        location ^~ /reset_password {
            proxy_pass http://mattermost:8065;
            include /etc/nginx/mattermost-upstream-common.conf;
        }

        location ^~ /mfa {
            proxy_pass http://mattermost:8065;
            include /etc/nginx/mattermost-upstream-common.conf;
        }

        location ^~ /oauth {
            proxy_pass http://mattermost:8065;
            include /etc/nginx/mattermost-upstream-common.conf;
        }

        # Root-relative MM assets (when the app still requests /static, /plugins, /files).
        # Twenty uses /assets/ and /images/, not /static/.
        location ^~ /static/ {
            proxy_pass http://mattermost:8065;
            include /etc/nginx/mattermost-upstream-common.conf;
        }

        location ^~ /plugins/ {
            proxy_pass http://mattermost:8065;
            include /etc/nginx/mattermost-upstream-common.conf;
        }

        location ^~ /files/ {
            proxy_pass http://mattermost:8065;
            include /etc/nginx/mattermost-upstream-common.conf;
        }

        location /auth/clerk/ {
            proxy_pass http://crm-server:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        location / {
            proxy_pass http://crm-server:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 600s;
        }
    }
}
