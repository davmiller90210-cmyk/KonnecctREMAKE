events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    # 1. HTTP Redirect to HTTPS (app)
    server {
        listen 80;
        server_name app.konnecct.com;

        # Allow Certbot Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTP Redirect to HTTPS (Plane / Konnecct Projects)
    server {
        listen 80;
        server_name projects.konnecct.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Konnecct CRM
    server {
        listen 443 ssl;
        server_name app.konnecct.com;

        ssl_certificate /etc/letsencrypt/live/app.konnecct.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.konnecct.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;

        # User-facing URLs are the Twenty SPA (/projects/* = CRM shell + embedded Plane).
        # Plane's bundle is mounted internally at /_konnecct/plane/ (strip → proxy root).
        # Build Plane web with Vite base and router basename /_konnecct/plane/ so assets
        # never collide with Twenty's /assets.
        location = /projects {
            return 301 https://$host/projects/;
        }

        location /projects/ {
            proxy_pass http://crm-server:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        location /_konnecct/plane/ {
            proxy_pass http://proxy:80/;
            include /etc/nginx/plane-upstream-common.conf;
        }

        # Mattermost webapp (strip prefix → container root). Public Site URL must match
        # https://$host/_konnecct/mattermost (MM_SERVICESETTINGS_SITEURL).
        location /_konnecct/mattermost/ {
            proxy_pass http://mattermost:8065/;
            include /etc/nginx/mattermost-upstream-common.conf;
        }

        # Twenty (crm-server) Clerk REST — must not go to Plane's /auth/ (would 404).
        location /auth/clerk/ {
            proxy_pass http://crm-server:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        location /api/ {
            proxy_pass http://proxy:80;
            include /etc/nginx/plane-upstream-common.conf;
        }

        location /auth/ {
            proxy_pass http://proxy:80;
            include /etc/nginx/plane-upstream-common.conf;
        }

        location /static/ {
            proxy_pass http://proxy:80;
            include /etc/nginx/plane-upstream-common.conf;
        }

        location /spaces/ {
            proxy_pass http://proxy:80;
            include /etc/nginx/plane-upstream-common.conf;
        }

        location /god-mode/ {
            proxy_pass http://proxy:80;
            include /etc/nginx/plane-upstream-common.conf;
        }

        location /live/ {
            proxy_pass http://proxy:80;
            include /etc/nginx/plane-upstream-common.conf;
        }

        location /uploads/ {
            proxy_pass http://proxy:80;
            include /etc/nginx/plane-upstream-common.conf;
        }

        location / {
            proxy_pass http://crm-server:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 600s;
        }
    }

    # 3. Plane (Konnecct Projects UI). Use the same TLS files as app.* after: certbot certonly ... -d app.konnecct.com -d projects.konnecct.com
    server {
        listen 443 ssl;
        server_name projects.konnecct.com;

        ssl_certificate /etc/letsencrypt/live/app.konnecct.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.konnecct.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://proxy:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
